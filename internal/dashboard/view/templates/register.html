{{define "title"}}Register{{end}}
{{define "content"}}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold text-center mb-3">Create Account</h3>
                <form method="POST" action="/register">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password (minimum 8 characters)</label>
                        <input type="password" class="form-control" id="password" name="password" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="/login" class="small ms-1">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
