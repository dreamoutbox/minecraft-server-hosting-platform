services:
  postgres:
    image: postgres:18-alpine
    container_name: mc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: minecraft_hosting
      PGDATA: /var/lib/postgresql
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  adminer:
    image: adminer:latest
    container_name: mc_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: mc_seaweedfs
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3"]
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data

volumes:
  pgdata:
  seaweedfs_data:

