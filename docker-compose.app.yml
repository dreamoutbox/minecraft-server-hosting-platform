volumes:
  fileserver_data:

services:
  apiserver:
    image: ${APISERVER_IMAGE:-dreamoutbox/minecraft-hosting-apiserver:latest}
    container_name: mc_apiserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: minecraft_hosting
      DB_SSLMODE: disable
      PORT_RANGE_MIN: "25565"
      PORT_RANGE_MAX: "25600"
      JWT_SECRET: dev-platform-jwt-secret-key-change-in-prod
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dev_mock_key}
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: minecraft-backups
      S3_USE_PATH_STYLE: "true"
      DEFAULT_WORKER_URL: http://worker:9090
      DEFAULT_WORKER_KEY: dev-worker-key
      DEFAULT_WORKER_NAME: worker1
      DEFAULT_WORKER_PUBLIC_DOMAIN: localhost
      DEFAULT_WORKER_PUBLIC_IP: 127.0.0.1
      DEFAULT_FILESERVER_URL: http://localhost:9100
      DEFAULT_FILESERVER_INTERNAL_URL: http://fileserver:9100
    ports:
      - "8080:8080"
    networks:
      - mc_platform_net

  worker:
    image: ${WORKER_IMAGE:-dreamoutbox/minecraft-hosting-worker:latest}
    container_name: mc_worker
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      WORKER_PORT: "9090"
      WORKER_API_KEY: dev-worker-key
      WORKER_BASE_DIR: /var/lib/mc-platform
      WORKER_MAX_SERVERS: "8"
      WORKER_LOOP_DEVICE_ENABLED: "true"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    # Allow allocating and mounting loop devices (block major 7)
    # without full privileged mode. Docker does not dynamically create
    # /dev/loopN nodes inside non-privileged containers, so loop0-loop7
    # must be mapped explicitly for `mount -o loop` to succeed.
    # Note: >8 concurrent loop mounts will fail unless more /dev/loopN
    # nodes are pre-created and mapped, or the worker runs on the host / privileged.
    devices:
      - /dev/loop-control:/dev/loop-control
      - /dev/loop0:/dev/loop0
      - /dev/loop1:/dev/loop1
      - /dev/loop2:/dev/loop2
      - /dev/loop3:/dev/loop3
      - /dev/loop4:/dev/loop4
      - /dev/loop5:/dev/loop5
      - /dev/loop6:/dev/loop6
      - /dev/loop7:/dev/loop7
    device_cgroup_rules:
      - "b 7:* rmw"
    ports:
      - "9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # rshared propagates loop mounts created inside mc_worker 
      # to the host and spawned Minecraft containers
      - /var/lib/mc-platform:/var/lib/mc-platform:rshared
    networks:
      - mc_platform_net

  fileserver:
    image: ${FILESERVER_IMAGE:-dreamoutbox/minecraft-hosting-fileserver:latest}
    container_name: mc_fileserver
    restart: unless-stopped
    environment:
      FILESERVER_PORT: "9100"
      FILESERVER_SQLITE_PATH: /data/fileserver.db
      FILESERVER_MOUNTS_DIR: /var/lib/mc-platform/mounts
      FILESERVER_API_KEY: dev-worker-key
      FILESERVER_JWT_SECRET: dev-fileserver-jwt-secret-change-in-prod
    ports:
      - "9100:9100"
    volumes:
      - /var/lib/mc-platform:/var/lib/mc-platform:rshared
      - fileserver_data:/data
    networks:
      - mc_platform_net

  jobworker:
    image: ${JOBWORKER_IMAGE:-dreamoutbox/minecraft-hosting-jobworker:latest}
    container_name: mc_jobworker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: minecraft_hosting
      DB_SSLMODE: disable
      PORT_RANGE_MIN: "25565"
      PORT_RANGE_MAX: "25600"
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: minecraft-backups
      S3_USE_PATH_STYLE: "true"
      DEFAULT_WORKER_URL: http://worker:9090
      DEFAULT_WORKER_KEY: dev-worker-key
      DEFAULT_FILESERVER_INTERNAL_URL: http://fileserver:9100
    networks:
      - mc_platform_net
