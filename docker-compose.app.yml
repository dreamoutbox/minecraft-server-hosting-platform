volumes:
  fileserver_data:

services:
  apiserver:
    image: ${APISERVER_IMAGE:-dreamoutbox/minecraft-hosting-apiserver:latest}
    container_name: mc_apiserver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      PORT: "${PORT:-8080}"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      DB_NAME: ${DB_NAME:-minecraft_hosting}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      PORT_RANGE_MIN: "${PORT_RANGE_MIN:-25565}"
      PORT_RANGE_MAX: "${PORT_RANGE_MAX:-25600}"
      JWT_SECRET: ${JWT_SECRET:-dev-platform-jwt-secret-key-change-in-prod}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SERVER_EXPIRED_DATA_RETENTION_DAYS: ${SERVER_EXPIRED_DATA_RETENTION_DAYS:-7}
      BACKUP_MAX_COUNT: "${BACKUP_MAX_COUNT:-8}"
      BACKUP_PRESIGN_TTL: ${BACKUP_PRESIGN_TTL:-1h}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dev_mock_key}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-minecraft-backups}
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      DEFAULT_WORKER_URL: ${DEFAULT_WORKER_URL:-http://worker:9090}
      DEFAULT_WORKER_KEY: ${DEFAULT_WORKER_KEY:-dev-worker-key}
      DEFAULT_WORKER_NAME: ${DEFAULT_WORKER_NAME:-worker1}
      DEFAULT_WORKER_PUBLIC_DOMAIN: ${DEFAULT_WORKER_PUBLIC_DOMAIN:-localhost}
      DEFAULT_WORKER_PUBLIC_IP: ${DEFAULT_WORKER_PUBLIC_IP:-127.0.0.1}
      DEFAULT_WORKER_MAX_SERVERS: "${WORKER_MAX_SERVERS:-20}"
      DEFAULT_FILESERVER_URL: ${DEFAULT_FILESERVER_URL:-http://localhost:9100}
      DEFAULT_FILESERVER_INTERNAL_URL: ${DEFAULT_FILESERVER_INTERNAL_URL:-http://fileserver:9100}
    ports:
      - "8080:8080"
    networks:
      - mc_platform_net

  worker:
    image: ${WORKER_IMAGE:-dreamoutbox/minecraft-hosting-worker:latest}
    container_name: mc_worker
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      WORKER_PORT: "${WORKER_PORT:-9090}"
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-worker-key}
      WORKER_BASE_DIR: ${WORKER_BASE_DIR:-/var/lib/mc-platform}
      WORKER_MAX_SERVERS: "${WORKER_MAX_SERVERS:-20}"
      WORKER_LOOP_DEVICE_ENABLED: "${WORKER_LOOP_DEVICE_ENABLED:-true}"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - MKNOD
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    # Docker's default AppArmor profile blocks ext4 loop mounts on Ubuntu/Debian hosts.
    security_opt:
      - apparmor:unconfined
    # Allow allocating and mounting any loop device (block major 7) without full
    # privileged mode. The worker allocates free indices via /dev/loop-control and
    # creates /dev/loopN nodes on demand using CAP_MKNOD, while device_cgroup_rules
    # restricts block device creation and access strictly to loop devices (7:*).
    devices:
      - /dev/loop-control:/dev/loop-control
    device_cgroup_rules:
      # Cgroup device allowlist rule: "<type> <major>:<minor> <permissions>"
      #   b   = block device (vs. c for character device)
      #   7   = Linux major number for loop devices (/dev/loop*)
      #   *   = any minor number (allows loop0, loop1, ..., loopN dynamically)
      #   rmw = permit read (r), mknod node creation (m), and write (w)
      # Lets mc_worker create and mount any /dev/loopN without granting access
      # to other host block devices (such as /dev/sda or /dev/nvme*).
      - "b 7:* rmw"
    ports:
      - "9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # rshared propagates loop mounts created inside mc_worker 
      # to the host and spawned Minecraft containers
      - /var/lib/mc-platform:/var/lib/mc-platform:rshared
    networks:
      - mc_platform_net

  fileserver:
    image: ${FILESERVER_IMAGE:-dreamoutbox/minecraft-hosting-fileserver:latest}
    container_name: mc_fileserver
    restart: unless-stopped
    environment:
      FILESERVER_PORT: "${FILESERVER_PORT:-9100}"
      FILESERVER_SQLITE_PATH: ${FILESERVER_SQLITE_PATH:-/data/fileserver.db}
      FILESERVER_MOUNTS_DIR: ${FILESERVER_MOUNTS_DIR:-/var/lib/mc-platform/mounts}
      FILESERVER_API_KEY: ${FILESERVER_API_KEY:-dev-worker-key}
      FILESERVER_JWT_SECRET: ${FILESERVER_JWT_SECRET:-dev-fileserver-jwt-secret-change-in-prod}
      FILESERVER_MAX_UPLOAD_MB: "${FILESERVER_MAX_UPLOAD_MB:-2048}"
      FILESERVER_DAILY_QUOTA_MB: "${FILESERVER_DAILY_QUOTA_MB:-5120}"
    ports:
      - "9100:9100"
    volumes:
      - /var/lib/mc-platform:/var/lib/mc-platform:rshared
      - fileserver_data:/data
    networks:
      - mc_platform_net

  jobworker:
    image: ${JOBWORKER_IMAGE:-dreamoutbox/minecraft-hosting-jobworker:latest}
    container_name: mc_jobworker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      DB_NAME: ${DB_NAME:-minecraft_hosting}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      PORT_RANGE_MIN: "${PORT_RANGE_MIN:-25565}"
      PORT_RANGE_MAX: "${PORT_RANGE_MAX:-25600}"
      SERVER_EXPIRED_DATA_RETENTION_DAYS: ${SERVER_EXPIRED_DATA_RETENTION_DAYS:-7}
      CRON_MC_SERVER_DATA_BACKUP: "${CRON_MC_SERVER_DATA_BACKUP:-0 5 * * *}"
      BACKUP_MAX_COUNT: "${BACKUP_MAX_COUNT:-8}"
      BACKUP_PRESIGN_TTL: ${BACKUP_PRESIGN_TTL:-1h}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-minecraft-backups}
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      DEFAULT_WORKER_URL: ${DEFAULT_WORKER_URL:-http://worker:9090}
      DEFAULT_WORKER_KEY: ${DEFAULT_WORKER_KEY:-dev-worker-key}
      DEFAULT_FILESERVER_INTERNAL_URL: ${DEFAULT_FILESERVER_INTERNAL_URL:-http://fileserver:9100}
    networks:
      - mc_platform_net
