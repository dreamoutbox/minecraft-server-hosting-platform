volumes:
  pgdata:
  seaweedfs_data:

networks:
  mc_platform_net:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: mc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: minecraft_hosting
      PGDATA: /var/lib/postgresql
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "minecraft_hosting" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mc_platform_net

  adminer:
    image: adminer:latest
    container_name: mc_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - mc_platform_net

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: mc_seaweedfs
    restart: unless-stopped
    command: [ "server", "-dir=/data", "-s3" ]
    ports:
      - "8888:8888"
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data
    networks:
      - mc_platform_net
